name: Football Data Center Pipeline

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'   # UTC 03/09/15/21시 = 한국시간 12/18/00/06시, 6시간 간격
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-datacenter
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1단계: 리그별 Matrix 병렬 수집 (이적/리그/구단) — 새 틀 3.2
  # ---------------------------------------------------------------
  collect-by-league:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2          # football-data.org 분당 10회 제한 준수
      matrix:
        league: [PL, PD, BL1, SA, FL1, ELC, DED]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'          # Persistent Caching (새 틀 3.2)
      - run: pip install -r requirements.txt

      - name: Restore pipeline state cache
        uses: actions/cache@v4
        with:
          path: |
            data/fetch_state.json
            data/master
          key: dc-state-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: |
            dc-state-${{ matrix.league }}-

      - name: Collect league/team/transfer (${{ matrix.league }})
        working-directory: ${{ github.workspace }}
        env:
          FOOTBALL_DATA_API_KEY1: ${{ secrets.FOOTBALL_DATA_API_KEY1 }}
          FOOTBALL_DATA_API_KEY2: ${{ secrets.FOOTBALL_DATA_API_KEY2 }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
          API_FOOTBALL_KEY2: ${{ secrets.API_FOOTBALL_KEY2 }}
          LEAGUE: ${{ matrix.league }}
          CATEGORY: all
        run: |
          python collectors.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.league }}
          path: data/
          retention-days: 3

  # ---------------------------------------------------------------
  # 2단계: 리그 무관 소스 수집 (FPL 선수 / BSD 이벤트)
  # ---------------------------------------------------------------
  collect-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Collect players (FPL) + events (BSD)
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_API_KEY2: ${{ secrets.BSD_API_KEY2 }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
          API_FOOTBALL_KEY2: ${{ secrets.API_FOOTBALL_KEY2 }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          CATEGORY=player python collectors.py
          CATEGORY=event  python collectors.py
          CATEGORY=elo    python collectors.py
          CATEGORY=stats  python collectors.py
          CATEGORY=live   python collectors.py
          CATEGORY=injury python collectors.py
          CATEGORY=lineup python collectors.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-global
          path: data/
          retention-days: 3

  # ---------------------------------------------------------------
  # 3단계: 병합 → 지표 연산 → 리포트 → 커밋
  # ---------------------------------------------------------------
  report:
    needs: [collect-by-league, collect-global]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # ⚠️ 2026-07-15: collect_xg_fbref.py가 fbrapi.com 호출 시
      # SSLCertVerificationError(unable to get local issuer certificate)로
      # 실패한 적 있음 — 로컬 CA 묶음이 오래됐을 가능성에 대비해 최신화.
      # (서버 쪽이 인증서 체인을 불완전하게 보내는 문제라면 이걸로도 안
      # 고쳐질 수 있음 — 그 경우 다음 실행 로그로 재확인 필요)
      - run: pip install --upgrade certifi

      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: artifacts/

      - name: Merge / Metrics / Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          BSD_API_KEY2: ${{ secrets.BSD_API_KEY2 }}
          # 2026-07-26 추가: 이 잡(report)이 collect-by-league/collect-global과
          # 별개 잡이라 그쪽 env가 자동으로 안 물려받아져서, collect_logos_
          # multileague.py 등에서 build_registry() 호출 시 이 키들이 전부
          # "미등록"으로 뜨던 문제 — 시크릿 자체는 있었는데 이 잡에만 전달이
          # 안 됐던 것. RAPIDAPI_KEY(sportscore)/APIFOOTBALL_COM_KEY는 yml
          # 어디에도 없어서 별개 문제로 보임(시크릿 자체 미등록 추정) — 여긴 안 건드림.
          FOOTBALL_DATA_API_KEY1: ${{ secrets.FOOTBALL_DATA_API_KEY1 }}
          FOOTBALL_DATA_API_KEY2: ${{ secrets.FOOTBALL_DATA_API_KEY2 }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY1: ${{ secrets.API_FOOTBALL_KEY1 }}
          API_FOOTBALL_KEY2: ${{ secrets.API_FOOTBALL_KEY2 }}
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: |
          python merge_artifacts.py artifacts/ data/
          # xG 계수가 없으면 StatsBomb Open으로 최초 1회 학습 (이후 커밋된 계수 재사용)
          test -f data/models/xg_coefficients.json || python train_xg.py
          python impact_engine.py
          python db.py
          # 2026-07-30 추가(인수인계 2-1): 개인기여도% 정확도 개선용 API-FOOTBALL
          # 선수스탯 수집. db.py 뒤(matches 테이블 필요) · app_export*.py 앞
          # (team_group_games가 data/metrics를 읽으니 그 전에 병합돼 있어야
          # 함)에 위치. 신규/미검증 스크립트라 collect_mls_official_stats.py와
          # 동일하게 || true로 안전 실패 처리 — 실패해도 나머지 파이프라인
          # 안 죽음. 무료 쿼터(키당 100/일) 제약으로 한 번에 다 못 채우는 게
          # 정상이며, 하루 4번 도는 이 파이프라인을 통해 며칠~몇 주에 걸쳐
          # 점진적으로 채워지도록 설계됨(data/master/af_player_stats_state.json
          # 에 진행상태 영구 저장 → 커밋되어 다음 실행에 이어짐).
          python collect_api_football_player_stats.py || true
          # 2026-07-31 추가(2-1 보조/2순위): API-FOOTBALL 계정정지 대응으로, 그 사이
          # Understat 크롤링해서 슈팅/유효슈팅 2개 필드만이라도 채운다(태클/키패스/
          # 드리블/인터셉트는 Understat에 없어서 여전히 공백 — API-FOOTBALL 복구 전까지
          # 못 채움). 크롤링이라 API보다 훨씬 깨지기 쉬워서 || true 필수.
          # API-FOOTBALL 계정 복구되면 이 줄은 끄는 걸 검토할 것(공식 API가 더 안정적).
          python collect_understat_shots.py || true
          # 2026-07-31 추가(2순위 크롤링 대상 나머지 둘): Football-Data.co.uk
          # (팀단위 결과/배당/슈팅/코너, MLS·엘리테세리엔 제외 7개리그) +
          # Club Elo(전세계 클럽 Elo 스냅샷, BSD ELO 보조/대조용). 둘 다
          # 정적 CSV라 Understat보다 안정적일 것으로 기대되지만, 이 프로젝트
          # 전체 원칙대로 실행 로그로 검증 전까지는 확정 아님. 실패해도
          # 나머지 파이프라인 안 죽게 || true.
          python collect_football_data_co_uk.py || true
          python collect_clubelo.py || true
          # 2026-07-31: fbrapi.com(collect_fbref_player_stats.py)은 여기서
          # 제거함 — SSL/User-Agent 다 고쳐봤지만 최종적으로 봇탐지 JS
          # 챌린지 페이지("Redirecting...")로 리다이렉트당하는 걸로 실측
          # 확인됨. requests로는 자바스크립트를 실행 못 해서 절대 못 뚫음 —
          # 코드로 고칠 수 있는 문제가 아니라 파일 자체를 뺌(스크립트는
          # 남겨뒀지만 파이프라인에서 호출 안 함).
          # 2026-07-31 추가(2-1 최종 대안): BSD 공식 스펙(football-schema.json,
          # 사용자가 BSD 사이트에서 직접 받음)에서 확인된 /api/v2/events/{id}/
          # player-stats/ 로 선수별 슈팅/유효슈팅/태클/인터셉트/키패스/드리블
          # 6개 필드를 채운다. matches.bsd_event_id(진짜 BSD 숫자id)가 필요한데,
          # 그건 collect_fixtures*.py + db.py 재실행 이후에야 채워지므로, 이
          # 스크립트 실행문은 아래쪽(db.py 재실행 직후)으로 옮김 — 여기 두면
          # 아직 id가 안 채워진 예전 DB를 보게 돼서 전부 대상 0건이 남(실측
          # 확인된 문제).
          python normalizer.py
          python viz_engine.py
          python player_profiler.py
          python season_aggregator.py
          python transfer_impact.py
          python report_generator.py
          python retention.py
          python collect_coaches.py
          python collect_fixtures.py
          # 2026-07-24: MLS·엘리테세리엔이 이제 LEAGUE_MATCHERS/LEAGUE_TEAM_MAPS에
          # 정식 포함돼서 이 실행이 곧 실전 수집이다(더 이상 리허설 아님).
          # rehearse_mls_norway_probe.py·collect_mls_norway_teams.py는 목적
          # (리그/팀 존재 확인) 달성해서 제거함 — mls_norway_team_maps.py 내용은
          # app_export_multileague.py의 LEAGUE_TEAM_MAPS로 그대로 병합됨.
          python collect_fixtures_multileague.py
          # 2026-07-31 추가: db.py(위쪽에서 이미 한 번 실행됨, 3번째 순서)가
          # collect_fixtures.py/collect_fixtures_multileague.py(17~18번째 순서)
          # 보다 먼저 도는 구조라, db.py가 h2h.json을 읽어 날짜/진짜BSD id를
          # 백필할 때 아직 이번 실행에서 새로 안 만들어진 예전 h2h.json을
          # 읽고 있었다(실측 확인: bsd_event_id가 전부 비어서 collect_bsd_
          # player_stats.py 대상이 0건이 나옴). 기존 순서(다른 스크립트들이
          # db.py를 일찍 필요로 함)는 안 건드리고, h2h.json이 방금 최신화된
          # 지금 시점에 db.py를 한 번 더 돌려서 날짜/id 백필만 다시 반영한다
          # (INSERT OR REPLACE라 재실행해도 안전 — 멱등성 있음).
          python db.py
          # 2026-07-31 추가: db.py의 load_events()는 매번 호출될 때마다 모든
          # 경기의 events를 삭제 후 재생성하고, canonical_id는 항상 NULL로
          # 리셋된다(재삽입 시 canonical_id 컬럼 자체를 안 채움 — normalizer.py가
          # 후처리하는 구조라서). db.py를 여기서 재실행하면서 그 이후로
          # normalizer.py가 다시 안 돈다면, 위쪽(8번째 순서)에서 이미 정규화한
          # canonical_id가 전부 날아간 채로 나머지 파이프라인이 진행되는
          # 심각한 회귀가 생긴다 — 그래서 normalizer.py도 같이 재실행한다.
          python normalizer.py
          # 2026-07-31 추가: collect_bsd_player_stats.py를 여기로 옮김(원래
          # 위쪽 db.py 1차 실행 직후에 있었는데, 그 시점엔 아직 이번 실행의
          # h2h.json이 안 만들어져서 matches.bsd_event_id가 전부 비어있었다
          # — 실측 확인: 대상 0건). 이제 db.py 2차 실행(바로 위) 직후라 진짜
          # BSD id가 채워진 상태를 보게 된다.
          python collect_bsd_player_stats.py || true
          python collect_xg_bsd.py
          # 2026-07-24: MLS xG 확인(rehearse_mls_norway_xg_probe.py)도 목적
          # 달성 — MLS는 이제 collect_xg_bsd.py의 LEAGUES에 정식 포함됨.
          python collect_transfers_bsd.py
          # 2026-07-18 추가: 득점왕/도움왕용. collect_fixtures*.py의 리그/팀
          # 매칭 로직을 재사용하므로 걔들 뒤에 두는 게 자연스럽고, app_export*.py가
          # 읽는 data/master/goalscorers.json을 만들어야 해서 그 앞에는 반드시 와야 한다.
          python collect_goalscorers.py
          # 2026-07-24 [임시/리허설] 득점왕 team 필드가 항상 None인 원인 확인용.
          # collect_goalscorers.py는 증분캐싱 때문에 이미 처리된 경기는 건너뛰어서
          # 이 프로브로 캐시 없이 직접 확인한다. 결과 확인 후 이 줄 삭제할 것.
          python rehearse_goal_team_probe.py || true
          # 2026-07-29 [진단/미검증] MLS 도움왕이 BSD 소스 특성상 실제보다 적게
          # 나오는 문제(MLS만의 "세컨더리 어시스트" 규정을 BSD가 반영 안 함,
          # 손흥민 실사례로 확인: 공식 10개인데 파이프라인 집계 6개) 대응.
          # mlssoccer.com 공식 API(Opta 기반, stats-api.mlssoccer.com)에서 직접
          # 받아보는 진단 수집기 — 정확한 응답 필드명은 이 실행 로그로 처음
          # 검증하는 것이라 실패 가능성이 높음. data/master/mls_official_stats.json에
          # [diag] 로그와 함께 저장만 하고 build_leaderboard()에 자동 병합은
          # 아직 안 함(필드 매핑 확정 전까지 수동 대조 단계) — 그래서 실패해도
          # 나머지 파이프라인에 영향 없도록 || true.
          python collect_mls_official_stats.py || true
          # 2026-07-23 추가: 무득점 선수도 league_apps에 반영(선발 명단 기반).
          # collect_goalscorers.py와 같은 이유로 그 뒤·app_export*.py 앞에 위치.
          # (rehearse_lineups_probe.py로 events/{eid}/lineups/ 구조 실측 확정
          # 완료 → 프로브는 목적을 달성해 제거함. defending per90 갱신은 이
          # 데이터로도 불가능함이 실측 확정됨 — 별도 미해결 항목.)
          python collect_lineups.py
          # 2026-07-16 추가: 아래 둘은 app_export*.py가 임베드하는 데이터를
          # 만들어야 해서 반드시 그 앞에 와야 한다.
          python train_ml_ensemble.py
          python collect_logos_multileague.py
          # 2026-08-01 추가: 이 4개는 원래 위쪽(9~13번 순서, viz_engine.py
          # 다음)에서 이미 한 번 돌았는데, 그 시점은 collect_bsd_player_stats.py
          # (아래쪽으로 옮겨진 뒤)보다 훨씬 전이라 태클/인터셉트/키패스/드리블
          # 데이터가 채워지기 전 상태로 player_profiles.json 등을 만들어냈다
          # (사용자가 제공한 파일로 실측 확인 — player_profiler.py/
          # season_aggregator.py/transfer_impact.py가 정확히 이 필드들을
          # 씀). app_export.py 직전에 재실행해서 최신 데이터를 반영한다.
          python player_profiler.py
          python season_aggregator.py
          python transfer_impact.py
          python report_generator.py
          python app_export.py
          python app_export_multileague.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ data/football.db
          git diff --cached --quiet || git commit -m "chore: datacenter run $(date -u +%Y-%m-%d)"
          git push

  # ---------------------------------------------------------------
  # 4번 업그레이드: 어느 단계든 실패하면 Issue 자동 생성 (조용한 실패 방지)
  # ---------------------------------------------------------------
  notify-failure:
    needs: [collect-by-league, collect-global, report]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 파이프라인 실패: ${new Date().toISOString().slice(0,10)}`,
              body: `데일리 파이프라인이 실패했습니다.\n\n실행 로그: ${run}\n\n확인 필요: API 키 만료, rate limit, 소스 스키마 변경 여부.`,
              labels: ['pipeline-failure']
            });
